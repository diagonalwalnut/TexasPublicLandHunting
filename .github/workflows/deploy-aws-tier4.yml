name: Deploy to AWS (Tier 4)

# Tier 4 deploy (serverless):
#   * static -> build the frontend, sync web/dist to S3 (minus api/), invalidate
#               CloudFront (identical to the Tier 3 static job; the static stack
#               is shared).
#   * api    -> build the Bref PHP function and `sam deploy` the Lambda + Function
#               URL + DynamoDB stack. The /api/* CloudFront origin is wired once
#               by deploy/aws/tier4/connect-cloudfront.sh (not in CI).
# Auth is GitHub OIDC -> a scoped IAM role (no long-lived AWS keys).
#
# Disabled by default (manual dispatch) so it does not collide with the Tier 3
# workflow. Flip `on.push` on once you have cut the site over to Tier 4.
#
# Required repo secrets (deploy/aws/tier4/setup-github-oidc-tier4.sh prints them):
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID,
#   BREF_FPM_LAYER_ARN, ALLOWED_ORIGINS, ADMIN_EMAILS (optional)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-aws-tier4
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  static:
    name: Build + publish static (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync web/dist/ "s3://${S3_BUCKET}/" --delete --exclude 'api/*'
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" --paths '/*'

  api:
    name: Build + deploy serverless API (SAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, sodium, xml
          tools: composer

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SAM build
        working-directory: deploy/aws/tier4
        run: sam build

      - name: SAM deploy
        working-directory: deploy/aws/tier4
        env:
          BREF_FPM_LAYER_ARN: ${{ secrets.BREF_FPM_LAYER_ARN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              "BrefFpmLayerArn=${BREF_FPM_LAYER_ARN}" \
              "AllowedOrigins=${ALLOWED_ORIGINS}" \
              "AdminEmails=${ADMIN_EMAILS}"
