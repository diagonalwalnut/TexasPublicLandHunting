name: Deploy to AWS

# Tier 3 deploy:
#   * static  -> build the frontend, sync web/dist to S3 (minus api/), invalidate
#                CloudFront.
#   * api     -> trigger /opt/tplh/deploy.sh on the EC2 origin via SSM (pulls the
#                repo and republishes the PHP API; no build on the box).
# Auth is GitHub OIDC -> a scoped IAM role (no long-lived AWS keys, no inbound SSH).
#
# One-time setup (see deploy/aws/README.md):
#   deploy/aws/provision.sh
#   deploy/aws/make-deploy-key.sh
#   deploy/aws/provision-cdn.sh
#   deploy/aws/setup-github-oidc.sh
# then add repo secrets: AWS_DEPLOY_ROLE_ARN, AWS_REGION, TPLH_INSTANCE_ID,
# S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  static:
    name: Build + publish static (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          # Publish static assets only; the PHP API is served by the EC2 origin,
          # never from S3, so exclude it.
          aws s3 sync web/dist/ "s3://${S3_BUCKET}/" --delete \
            --exclude 'api/*'
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths '/*'

  api:
    name: Deploy API (SSM)
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger API deploy on the instance via SSM
        env:
          INSTANCE_ID: ${{ secrets.TPLH_INSTANCE_ID }}
        run: |
          set -euo pipefail
          echo "Sending deploy command to $INSTANCE_ID"
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy API ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --parameters 'commands=["sudo bash /opt/tplh/deploy.sh"],executionTimeout=["1800"]' \
            --query 'Command.CommandId' --output text)"
          echo "Command id: $CMD_ID"

          set +e
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          WAIT_RC=$?
          set -e

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)"
          echo "::group::deploy stdout"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::deploy stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "Final status: $STATUS"
          if [[ "$STATUS" != "Success" ]]; then
            echo "API deploy failed (status=$STATUS, waiter_rc=$WAIT_RC)"
            exit 1
          fi
          echo "API deploy succeeded."
