name: Deploy to AWS

# Manual deploy:
#   * static -> build the frontend, sync web/dist to S3 (minus api/), invalidate
#               CloudFront.
#   * api    -> build the Bref PHP function and `sam deploy` the Lambda + Function
#               URL + DynamoDB stack. /api/* is pointed at that function once,
#               by deploy/aws/connect-cloudfront.sh (not in CI).
# Auth is GitHub OIDC -> a scoped IAM role (no long-lived AWS keys).
#
# Required repo secrets (deploy/aws/setup-github-oidc.sh prints them):
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID,
#   BREF_FPM_LAYER_ARN, ALLOWED_ORIGINS, ADMIN_EMAILS (optional)

on:
  workflow_dispatch:
   push:
     branches: [main]

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  static:
    name: Build + publish static (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync web/dist/ "s3://${S3_BUCKET}/" --delete --exclude 'api/*'
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" --paths '/*'

  api:
    name: Build + deploy serverless API (SAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, sodium, xml
          tools: composer

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SAM build
        working-directory: deploy/aws
        run: sam build

      - name: SAM deploy
        working-directory: deploy/aws
        env:
          BREF_FPM_LAYER_ARN: ${{ secrets.BREF_FPM_LAYER_ARN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          overrides=(
            "BrefFpmLayerArn=${BREF_FPM_LAYER_ARN}"
            "AllowedOrigins=${ALLOWED_ORIGINS}"
          )
          if [[ -n "${ADMIN_EMAILS}" ]]; then
            overrides+=("AdminEmails=${ADMIN_EMAILS}")
          fi
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides "${overrides[@]}"
