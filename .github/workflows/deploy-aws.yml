name: Deploy to AWS

# Manual deploy:
#   * static -> build the frontend, sync web/dist to S3 (minus api/), invalidate
#               CloudFront.
#   * api    -> build the Bref PHP function and `sam deploy` the Lambda + Function
#               URL + DynamoDB stack. /api/* is pointed at that function once,
#               by deploy/aws/connect-cloudfront.sh (not in CI).
# Auth is GitHub OIDC -> a scoped IAM role (no long-lived AWS keys).
#
# Required repo secrets (deploy/aws/setup-github-oidc.sh prints them):
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID,
#   BREF_FPM_LAYER_ARN, ALLOWED_ORIGINS, ADMIN_EMAILS (optional)on:

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  static:
    name: Build + publish static (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          
      - name: Show OIDC context (no token)
        run: |
          echo "repository=${GITHUB_REPOSITORY}"
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
      
      - name: Check selected AWS role (no ARN output)
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ "$ROLE_ARN" == "arn:aws:iam::022444447241:role/tplh-gha-deploy-tier4" ]]; then
            echo "production_role_selected=yes"
          else
            echo "production_role_selected=no"
          fi

      - name: Show OIDC claims (not the token)
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          parts = urllib.parse.urlsplit(url)
          query = urllib.parse.parse_qsl(parts.query)
          query.append(("audience", "sts.amazonaws.com"))
          url = urllib.parse.urlunsplit(
              (parts.scheme, parts.netloc, parts.path,
               urllib.parse.urlencode(query), parts.fragment)
          )

          request = urllib.request.Request(
              url, headers={"Authorization": f"Bearer {token}"}
          )
          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub"):
              print(f"{key}={claims.get(key)}")
          PY
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Verify assumed identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Sync to S3 and invalidate CloudFront
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync web/dist/ "s3://${S3_BUCKET}/" --delete --exclude 'api/*'
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" --paths '/*'

  api:
    name: Build + deploy serverless API (SAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, sodium, xml
          tools: composer

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Show OIDC context (no token)
        run: |
          echo "repository=${GITHUB_REPOSITORY}"
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
      
      - name: Check selected AWS role (no ARN output)
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ "$ROLE_ARN" == "arn:aws:iam::022444447241:role/tplh-gha-deploy-tier4" ]]; then
            echo "production_role_selected=yes"
          else
            echo "production_role_selected=no"
          fi

      - name: Show OIDC claims (not the token)
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          parts = urllib.parse.urlsplit(url)
          query = urllib.parse.parse_qsl(parts.query)
          query.append(("audience", "sts.amazonaws.com"))
          url = urllib.parse.urlunsplit(
              (parts.scheme, parts.netloc, parts.path,
               urllib.parse.urlencode(query), parts.fragment)
          )

          request = urllib.request.Request(
              url, headers={"Authorization": f"Bearer {token}"}
          )
          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub"):
              print(f"{key}={claims.get(key)}")
          PY
        
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SAM build
        working-directory: deploy/aws
        run: sam build

      - name: SAM deploy
        working-directory: deploy/aws
        env:
          BREF_FPM_LAYER_ARN: ${{ secrets.BREF_FPM_LAYER_ARN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          overrides=(
            "BrefFpmLayerArn=${BREF_FPM_LAYER_ARN}"
            "AllowedOrigins=${ALLOWED_ORIGINS}"
          )
          if [[ -n "${ADMIN_EMAILS}" ]]; then
            overrides+=("AdminEmails=${ADMIN_EMAILS}")
          fi
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides "${overrides[@]}"
