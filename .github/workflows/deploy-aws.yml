name: Deploy to AWS

# Builds + publishes the site on the EC2 instance by invoking /opt/tplh/deploy.sh
# through AWS Systems Manager (SSM). No inbound SSH and no long-lived AWS keys:
# authentication uses GitHub OIDC -> an IAM role scoped to this one instance.
#
# One-time setup (see deploy/aws/README.md):
#   deploy/aws/provision.sh
#   deploy/aws/make-deploy-key.sh
#   deploy/aws/setup-github-oidc.sh
# then add repo secrets: AWS_DEPLOY_ROLE_ARN, AWS_REGION, TPLH_INSTANCE_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger deploy on the instance via SSM
        env:
          INSTANCE_ID: ${{ secrets.TPLH_INSTANCE_ID }}
        run: |
          set -euo pipefail
          echo "Sending deploy command to $INSTANCE_ID"
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --parameters 'commands=["sudo bash /opt/tplh/deploy.sh"],executionTimeout=["1800"]' \
            --query 'Command.CommandId' --output text)"
          echo "Command id: $CMD_ID"

          # Wait for completion (waiter fails if the command ends non-Success).
          set +e
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          WAIT_RC=$?
          set -e

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)"
          echo "::group::deploy stdout"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::deploy stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "Final status: $STATUS"
          if [[ "$STATUS" != "Success" ]]; then
            echo "Deploy failed (status=$STATUS, waiter_rc=$WAIT_RC)"
            exit 1
          fi
          echo "Deploy succeeded."
