name: Deploy to HostGator

# Builds a HostGator-ready copy of web/dist (Vite base /) and uploads it
# over FTP when FTP_USER and FTP_PASSWORD are set.
#
# huntpubliclandintexas.com already points at HostGator (192.185.41.29).
# ftp.huntpubliclandintexas.com has no DNS; default FTP_HOST is that IP.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/deploy-hostgator.py"
      - ".github/workflows/hostgator.yml"

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build site for a HostGator domain root
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build
      - name: HostGator public_html zip
        run: |
          cd web/dist
          zip -r "$GITHUB_WORKSPACE/hostgator-public-html.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: hostgator-public-html
          path: hostgator-public-html.zip
      - name: Upload dist over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Built hostgator-public-html.zip (download this workflow's artifact)."
            echo "FTP upload skipped: add repository secrets FTP_USER and FTP_PASSWORD"
            echo "(cPanel → FTP Accounts). Optional FTP_HOST (default 192.185.41.29),"
            echo "FTP_REMOTE_DIR (default public_html), FTP_PORT (default 21)."
            echo "Then re-run: Actions → Deploy to HostGator → Run workflow."
            exit 1
          fi
          python3 scripts/deploy-hostgator.py
