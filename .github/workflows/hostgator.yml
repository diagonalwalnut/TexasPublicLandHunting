name: Deploy to HostGator

# Does not run on every push. Add FTP_HOST, FTP_USER, and FTP_PASSWORD
# (optional FTP_REMOTE_DIR, FTP_PORT) as repository secrets, then run this
# workflow from the Actions tab.
on:
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Require FTP secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Add repository secrets FTP_HOST, FTP_USER, and FTP_PASSWORD (cPanel FTP), then re-run."
            echo "Optional: FTP_REMOTE_DIR (default public_html), FTP_PORT (default 21)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build site for a HostGator domain root
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Upload dist over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: python3 scripts/deploy-hostgator.py
