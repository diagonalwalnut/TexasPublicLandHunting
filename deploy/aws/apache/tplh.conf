# Reference Apache vhost for Texas Public Land Hunting.
#
# This is the canonical, reviewable copy of the server config that bootstrap.sh
# writes to /etc/httpd/conf.d/tplh.conf on the instance (with ${DOMAIN} and the
# paths substituted). setup-tls.sh adds the matching port-443 vhost.
#
# Key points:
#   * DocumentRoot is the `current` symlink (atomic release swaps).
#   * AllowOverride All so the app's web/public/.htaccess and api/.htaccess work
#     unchanged (same as HostGator/Apache today): /api routing, HTTPS redirect,
#     denial of api/data, caching, and security headers.
#   * .php is handled by php-fpm (default /etc/httpd/conf.d/php.conf). The app
#     env (AUTH_DATA_DIR, AUTH_ADMIN_EMAILS) is set on the php-fpm pool, not here.
#   * The ACME challenge Alias is served with AllowOverride None so the force-
#     HTTPS .htaccess cannot break Let's Encrypt HTTP-01 validation.

<VirtualHost *:80>
    ServerName ${DOMAIN}
    ServerAlias www.${DOMAIN}
    DocumentRoot /var/www/tplh/current

    Alias /.well-known/acme-challenge /var/www/tplh/acme/.well-known/acme-challenge
    <Directory /var/www/tplh/acme>
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/tplh/current>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog logs/tplh_error.log
    CustomLog logs/tplh_access.log combined
</VirtualHost>
