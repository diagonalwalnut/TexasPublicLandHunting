# Reference Apache vhost for the Texas Public Land Hunting API origin (Tier 3).
#
# This is the canonical, reviewable copy of the origin config that bootstrap.sh
# writes to /etc/httpd/conf.d/tplh.conf (with ${API_ORIGIN_DOMAIN} and the paths
# substituted). setup-tls.sh adds the matching port-443 vhost for the origin cert.
#
# In Tier 3, CloudFront serves the static site from S3 and routes only /api/* to
# this instance, forwarding the viewer Host header. This is the default vhost so
# it answers for whatever Host CloudFront forwards.
#
# Key points:
#   * DocumentRoot is the `current` symlink (atomic release swaps); in Tier 3 the
#     release contains the PHP api/ tree.
#   * AllowOverride All so the app's api/.htaccess works unchanged (/api routing,
#     denial of api/data). Public security headers + HTTPS are handled by the
#     CloudFront response-headers policy, not here.
#   * .php is handled by php-fpm (default /etc/httpd/conf.d/php.conf). The app env
#     (AUTH_DATA_DIR, AUTH_ADMIN_EMAILS) is set on the php-fpm pool, not here.
#   * The ACME challenge Alias is served with AllowOverride None so the force-
#     HTTPS .htaccess cannot break Let's Encrypt HTTP-01 validation for the
#     origin certificate.

<VirtualHost *:80>
    ServerName ${API_ORIGIN_DOMAIN}
    DocumentRoot /var/www/tplh/current

    Alias /.well-known/acme-challenge /var/www/tplh/acme/.well-known/acme-challenge
    <Directory /var/www/tplh/acme>
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/tplh/current>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog logs/tplh_error.log
    CustomLog logs/tplh_access.log combined
</VirtualHost>
