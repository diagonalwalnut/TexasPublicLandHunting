version = 0.1

# Default SAM deploy configuration for the accounts API.
# Edit the parameter_overrides for your account, then run:
#   sam build && sam deploy
#
# BrefFpmLayerArn is the Bref 3 unified arm64 PHP 8.3 layer
# (https://runtimes.bref.sh, account 873528684822). The template sets
# BREF_RUNTIME=fpm so that layer serves HTTP. composer.json must require
# bref/bref ^3: the layer loads Bref\FpmRuntime\Main from the deployment
# package, and Bref 2 never returns an HTTP response (Function URL 502
# "Internal Server Error", which the site shows as "Accounts not available").
# AllowedOrigins must list your public hostnames. AdminEmails is optional.

[default.global.parameters]
stack_name = "tplh-tier4-api"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "tplh-tier4-api"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = [
  "TableName=tplh_accounts",
  "AppKeySsmParam=/tplh/tier4/app_key",
  "AllowedOrigins=huntpubliclandintexas.com www.huntpubliclandintexas.com",
  "LambdaArch=arm64",
  "BrefFpmLayerArn=arn:aws:lambda:us-east-1:873528684822:layer:arm-php-83:24",
]

[default.sync.parameters]
watch = false
