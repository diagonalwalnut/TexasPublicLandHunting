version = 0.1

# Default SAM deploy configuration for the Tier 4 accounts API.
# Edit the parameter_overrides for your account, then run:
#   sam build && sam deploy
#
# BrefFpmLayerArn MUST be set to the current Bref FPM layer for your region and
# architecture (https://runtimes.bref.sh, account 534081306603). AllowedOrigins
# must list your public hostnames. AdminEmails is optional.

[default.global.parameters]
stack_name = "tplh-tier4-api"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "tplh-tier4-api"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = [
  "TableName=tplh_accounts",
  "AppKeySsmParam=/tplh/tier4/app_key",
  "AllowedOrigins=huntpubliclandintexas.com www.huntpubliclandintexas.com",
  "LambdaArch=arm64",
  "BrefFpmLayerArn=arn:aws:lambda:us-east-1:873528684822:layer:arm-php-83:23",
]

[default.sync.parameters]
watch = false
